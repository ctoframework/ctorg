[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctorg"
version = "0.1.0"
description = "Draw an org chart from a JSON file, in the terminal, as PNG, or as SVG."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "Pillow>=10.0",
    "svgwrite>=1.4",
]

[project.scripts]
ctorg = "ctorg:main"

[tool.setuptools]
py-modules = ["ctorg"]
